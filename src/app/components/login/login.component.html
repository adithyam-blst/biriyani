<div class="login-container">
  <div class="login-card">
    <h2>🍛 Biriyani Order Portal</h2>
    <p class="subtitle">Login to order your favorite biriyani</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="employeeId">Employee ID</label>
        <input
          type="text"
          id="employeeId"
          formControlName="employeeId"
          placeholder="Enter your employee ID"
          [class.error]="employeeId?.invalid && employeeId?.touched"
        />
        <div class="error-message" *ngIf="employeeId?.invalid && employeeId?.touched">
          <span *ngIf="employeeId?.errors?.['required']">Employee ID is required</span>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          placeholder="Enter your password"
          [class.error]="password?.invalid && password?.touched"
        />
        <div class="error-message" *ngIf="password?.invalid && password?.touched">
          <span *ngIf="password?.errors?.['required']">Password is required</span>
          <span *ngIf="password?.errors?.['minlength']">Password must be at least 6 characters</span>
        </div>
      </div>

      <div class="error-alert" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="isLoading || loginForm.invalid" class="login-btn">
        <span *ngIf="isLoading">Logging in...</span>
        <span *ngIf="!isLoading">Login</span>
      </button>
    </form>

    <p class="info-text">Session expires after 1 hour</p>
  </div>
</div>
